name: Refresh forecast

on:
  schedule:
    # Every Monday at 06:00 UTC — after TfL usually publishes the latest extract.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run pipeline (ingest -> build -> train -> forecast)
        run: python -m bikeforecast.pipeline --weeks 8

      - name: Commit refreshed forecast + evaluation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/forecast.parquet data/processed/station_risk.parquet reports/evaluation.json
          git diff --cached --quiet || git commit -m "Scheduled forecast refresh"
          git push
